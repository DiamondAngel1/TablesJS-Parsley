<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Register Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="p-4">
    <h1 class="text-center mb-4">Register form</h1>

    <form id="registerForm" class="w-50 mx-auto" data-parsley-validate>
        <input type="text" id="username" name="username" class="form-control mb-2" placeholder="Username" required
            data-parsley-minlength="4" 
            data-parsley-maxlength="20"
            data-parsley-pattern="^(?!admin$|user$|test$|Admin$|User$|Test$).+"
            data-parsley-required-message="Username is required"
            data-parsley-minlength-message="Min length is 4 characters"
            data-parsley-maxlength-message="Max length is 20 characters"
            data-parsley-pattern-message="Username 'admin', 'user' or 'test' is not allowed">

        <input type="email" id="email" name="email" class="form-control mb-2" placeholder="Email" required
            data-parsley-type="email" 
            data-parsley-required-message="Email is required"
            data-parsley-type-message="Enter a valid email address">

        <input type="password" id="password" name="password" class="form-control mb-2" placeholder="Password" required
            data-parsley-minlength="6" 
            data-parsley-maxlength="30" 
            data-parsley-required-message="Password is required"
            data-parsley-minlength-message="Min length is 6 characters"
            data-parsley-maxlength-message="Max length is 30 characters">

        <input type="password" id="repeat" name="repeat" class="form-control mb-2" placeholder="Repeat Password" required 
            data-parsley-equalto="#password" 
            data-parsley-required-message="Repeat is required"
            data-parsley-equalto-message="Passwords must match">

        <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <div id="result" class="mt-4 w-50 mx-auto"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/node_modules/parsleyjs/dist/parsley.min.js"></script>

    <script>
        function getPasswordStrength(pass) {
            const hasLower = /[a-z]/.test(pass);
            const hasUpper = /[A-Z]/.test(pass);
            const hasDigit = /\d/.test(pass);
            const hasSpecial = /[^a-zA-Z0-9]/.test(pass);

            if ((/^\d+$/.test(pass)) || (/^[a-z]+$/.test(pass)) || (/^[A-Z]+$/.test(pass))) return 'very easy';
            if (hasDigit && (hasLower || hasUpper) && !(hasLower && hasUpper)) return 'easy';
            if (hasDigit && hasLower && hasUpper && !hasSpecial) return 'normal';
            if (hasDigit && hasLower && hasUpper && hasSpecial) return 'hard';
            return 'unknown';
        }

        $(document).ready(function () {
            const $form = $('#registerForm');

            $form.parsley().on('form:submit', function () {
                const username = $('#username').val().trim();
                const email = $('#email').val().trim();
                const password = $('#password').val();
                const strength = getPasswordStrength(password);
                const stars = '*'.repeat(password.length);

                $('#result').html(`
                    <table class="table table-bordered mt-3">
                        <thead><tr><th>Username</th><th>Email</th><th>Password</th></tr></thead>
                        <tbody>
                            <tr>
                                <td>${username}</td>
                                <td>${email}</td>
                                <td>${stars} (${strength})</td>
                            </tr>
                        </tbody>
                    </table>
                `);

                return false;
            });

            $form.parsley().on('form:error', function () {
                const errors = [];
                $form.find('[data-parsley-id]').each(function () {
                    const fieldErrors = $(this).parsley().getErrorsMessages();
                    errors.push(fieldErrors);
                });
            });
        });
    </script>
</body>

</html>
